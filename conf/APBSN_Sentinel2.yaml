model: 
  type: APBSN
  kwargs:
    pd_a: 5
    pd_b: 2
    pd_pad: 2
    R3: True
    R3_T: 8
    R3_p: 0.16
    bsn: DBSNl
    in_ch: 3
    bsn_base_ch: 128
    bsn_num_module: 9
    
model_input: [noisy] # The model will receive the synthesized noisy image

trainer: Trainer

training:
  dataset: prep_SatelliteImages  # use dataset class name

  dataset_args:
    split: train
    add_noise: sentinel2-1000:10  # photon_scale=1000, noise_boost=10
    crop_size: [120, 120]
    aug: ['hflip', 'rot']
    n_repeat: 4
  
  batch_size: 8
  max_epoch: 20
  
  init_lr: 1e-4
  scheduler:
    type: step
    step:
      step_size: 8
      gamma: 0.1
  loss: 1*self_L1
  tmp_info: []
  optimizer:
    type: Adam
    Adam:
      betas: [0.9, 0.999]

  warmup: False
  warmup_iter: 200

validation:
  dataset: prep_SatelliteImages  # use same class for validation

  dataset_args:
    split: val
    crop_size: [120, 120]  # Same as training for consistency
    add_noise: sentinel2-1000:10  # Same noise for consistency

  add_con: 0.5
  floor: True
  val: True
  save_image: True
  
  start_epoch: 1
  interval_epoch: 1
  
checkpoint:
  save: True
  start_epoch: 1
  interval_epoch: 1

log:
  interval_iter: 10

test:
  dataset: prep_SatelliteImages  # use same class for testing

  dataset_args:
    split: test
    crop_size: [120, 120]  # Consistent with training/validation
    add_noise: sentinel2-1000:10

  add_con: 0.0
  floor: False
  save_image: True